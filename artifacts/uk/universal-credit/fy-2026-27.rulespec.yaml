format: rulespec/v1
module:
  kind: composition
  summary: 'Deterministic composition for uk/universal-credit at 2026-04. Outputs: universal_credit_award_amount, universal_credit_maximum_amount, standard_allowance_amount, amount_included_under_section_10_responsibility_for_children_and_young_persons, amount_included_under_section_11_housing_costs, amount_included_under_section_12_other_particular_needs_or_circumstances, universal_credit_award_deduction_from_maximum_amount, child_element_amount, disabled_child_additional_amount, childcare_costs_element_amount, lcwra_element_amount, carer_element, childcare_costs_element_maximum_amount. Corpus: unversioned corpus.'
imports:
- uk:statutes/ukpga/2012/5/8
- uk:regulations/uksi/2013/376/22
- uk:regulations/uksi/2013/376/24
- uk:regulations/uksi/2013/376/36#child_element_amount
- uk:regulations/uksi/2013/376/26
- uk:regulations/uksi/2013/376/27
- uk:regulations/uksi/2013/376/29
- uk:regulations/uksi/2013/376/34
- uk:regulations/uksi/2013/376/36
- uk:regulations/uksi/2013/376/schedule/4/paragraph/22
- uk:regulations/uksi/2013/376/schedule/4/paragraph/14#total_housing_cost_contributions_to_be_deducted_in_renters_case
- uk:regulations/uksi/2013/376/schedule/5/paragraph/9
- uk:regulations/uksi/2013/376/schedule/5/paragraph/13#owner_occupier_service_charge_payments_amount
rules:
- name: adult_of_benefit_unit
  kind: data_relation
  data_relation:
    arity: 2
  source: axiom-programs/uk/universal-credit runtime adult membership
- name: child_of_benefit_unit
  kind: data_relation
  data_relation:
    arity: 2
  source: axiom-programs/uk/universal-credit runtime child membership
- name: amount_included_under_section_9_standard_allowance
  kind: derived
  entity: Family
  dtype: Money
  period: Month
  source: axiom-programs/uk/universal-credit bridge from WRA 2012 s.9 to UC Regs 2013 reg. 36
  versions:
  - effective_from: '2026-04-01'
    formula: standard_allowance_amount
  unit: GBP
- name: amount_included_under_section_10_responsibility_for_children_and_young_persons
  kind: derived
  entity: Family
  dtype: Money
  period: Month
  source: axiom-programs/uk/universal-credit bridge from WRA 2012 s.10 to UC Regs 2013 regs. 24 and 36
  versions:
  - effective_from: '2026-04-01'
    formula: 'sum(child_of_benefit_unit.responsible_child_element_included_amount)

      + sum(child_of_benefit_unit.disabled_child_additional_amount)'
  unit: GBP
- name: amount_calculated_under_schedule_4
  kind: derived
  entity: Family
  dtype: Money
  period: Month
  source: axiom-programs/uk/universal-credit bridge from UC Regs 2013 reg. 26 to Schedule 4 paragraph 22
  versions:
  - effective_from: '2026-04-01'
    formula: renters_housing_costs_element_calculated_under_this_part
  unit: GBP
- name: amount_calculated_under_schedule_5
  kind: derived
  entity: Family
  dtype: Money
  period: Month
  source: axiom-programs/uk/universal-credit bridge from UC Regs 2013 reg. 26 to Schedule 5 paragraph 9
  versions:
  - effective_from: '2026-04-01'
    formula: owner_occupier_housing_costs_element_amount
  unit: GBP
- name: amount_included_under_section_11_housing_costs
  kind: derived
  entity: Family
  dtype: Money
  period: Month
  source: axiom-programs/uk/universal-credit bridge from WRA 2012 s.11 to UC Regs 2013 reg. 26
  versions:
  - effective_from: '2026-04-01'
    formula: sum(adult_of_benefit_unit.housing_cost_element_under_shared_ownership)
  unit: GBP
- name: universal_credit_award_carer_element_included_amount
  kind: derived
  entity: Family
  dtype: Money
  period: Month
  source: axiom-programs/uk/universal-credit bridge from UC Regs 2013 regs. 29 and 36
  versions:
  - effective_from: '2026-04-01'
    formula: "if both_joint_claimants_carer_elements_included:\n  2 * carer_element_amount\nelse:\n  sum_where(adult_of_benefit_unit, carer_element_amount, claimant_carer_element_included)"
  unit: GBP
- name: amount_included_under_section_12_other_particular_needs_or_circumstances
  kind: derived
  entity: Family
  dtype: Money
  period: Month
  source: axiom-programs/uk/universal-credit bridge from WRA 2012 s.12 to UC Regs 2013 regs. 27, 29, and 34
  versions:
  - effective_from: '2026-04-01'
    formula: 'universal_credit_award_lcwra_element_included_amount

      + universal_credit_award_carer_element_included_amount

      + childcare_costs_element_amount'
  unit: GBP
- name: earned_income_deduction_calculated_in_prescribed_manner
  kind: derived
  entity: Family
  dtype: Money
  period: Month
  source: axiom-programs/uk/universal-credit bridge from WRA 2012 s.8 to UC Regs 2013 reg. 22
  versions:
  - effective_from: '2026-04-01'
    formula: earned_income_deduction_from_maximum_amount
  unit: GBP
- name: unearned_income_deduction_calculated_in_prescribed_manner
  kind: derived
  entity: Family
  dtype: Money
  period: Month
  source: axiom-programs/uk/universal-credit bridge from WRA 2012 s.8 to UC Regs 2013 reg. 22
  versions:
  - effective_from: '2026-04-01'
    formula: max(0, unearned_income_for_deduction)
  unit: GBP
